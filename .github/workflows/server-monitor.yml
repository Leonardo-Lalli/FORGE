name: Server Monitor

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-server:
    runs-on: ubuntu-latest
    steps:
      - name: Check PocketBase health
        env:
          POCKETBASE_URL: ${{ secrets.POCKETBASE_URL }}
        run: |
          if [ -z "$POCKETBASE_URL" ]; then
            echo 'Health check not configured.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if curl --fail --silent --show-error --retry 2 --retry-delay 5 --max-time 10 "${POCKETBASE_URL%/}/api/health" >/dev/null; then
            echo 'PocketBase health check passed. This does not verify login or push delivery.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'PocketBase health endpoint could not be reached after retries.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
