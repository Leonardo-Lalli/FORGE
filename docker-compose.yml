services:
  pocketbase:
    image: forge-pocketbase:${PB_VERSION:?Set a reviewed PB_VERSION in .env}
    build:
      context: ./tools/docker
      dockerfile: Dockerfile.pocketbase
      args:
        PB_VERSION: ${PB_VERSION:?Set a reviewed PB_VERSION in .env}
    container_name: forge-pocketbase
    restart: unless-stopped
    ports:
      - "${PB_BIND_ADDRESS:-127.0.0.1}:8090:8090"
    volumes:
      - ./pb_data:/pb_data
      - ./pb_public:/pb_public
      - ./tools/pocketbase/pb_hooks:/pb_hooks:ro
      # Installed explicitly after collection initialization; do not auto-migrate an empty database.
      - ./tools/pocketbase/pb_migrations:/forge_migrations:ro
    environment:
      - PB_ENCRYPTION_KEY=${PB_ENCRYPTION_KEY:-}
      - FORGE_PUSH_WORKER_TOKEN=${FORGE_PUSH_WORKER_TOKEN:-}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  init:
    profiles: ["setup"]
    image: alpine:3.22
    container_name: forge-init
    depends_on:
      pocketbase:
        condition: service_healthy
    volumes:
      - ./tools/init-pocketbase.sh:/init.sh:ro
    environment:
      - PB_URL=http://pocketbase:8090
      - PB_ADMIN_EMAIL=${PB_ADMIN_EMAIL:?Set PB_ADMIN_EMAIL in .env}
      - PB_ADMIN_PASSWORD=${PB_ADMIN_PASSWORD:?Set a unique PB_ADMIN_PASSWORD in .env}
    command: sh -c "apk add --no-cache curl jq && sh /init.sh"

  show-ip:
    profiles: ["setup"]
    image: alpine:3.22
    container_name: forge-show-ip
    depends_on:
      init:
        condition: service_completed_successfully
      pocketbase:
        condition: service_healthy
    volumes:
      - ./tools/show-ip.sh:/show-ip.sh:ro
    command: sh /show-ip.sh
    network_mode: host

  push:
    profiles: ["push"]
    build:
      context: ./tools
      dockerfile: docker/Dockerfile.push
    restart: unless-stopped
    depends_on:
      pocketbase:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/forge/service-account.json
      FORGE_INTERNAL_API: http://pocketbase:8090/api
      FORGE_PUSH_WORKER_TOKEN: ${FORGE_PUSH_WORKER_TOKEN:-}
    volumes:
      - type: bind
        source: ${FORGE_FIREBASE_KEY_FILE:-./secrets/firebase-admin.json}
        target: /run/forge/service-account.json
        read_only: true
        bind:
          create_host_path: false
