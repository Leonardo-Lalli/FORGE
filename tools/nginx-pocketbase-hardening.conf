# Include in the PUBLIC HTTPS server block, retaining your existing proxy location.
# With Nginx Proxy Manager inspect `nginx -T`: its generated location / may
# define add_header directives that override server-level inheritance.
location = /_ { return 403; }
location ^~ /_/ { return 403; }

# Dashboard blocking alone does not block superuser API authentication.
# Administration must use a separate private/LAN/VPN endpoint.
location = /api/collections/_superusers { return 403; }
location ^~ /api/collections/_superusers/ { return 403; }
location = /api/admins { return 403; }
location ^~ /api/admins/ { return 403; }

# Apply these to the location serving API responses as well if it already
# declares add_header. Avoid duplicate headers; validate with nginx -t.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
client_max_body_size 10m;
server_tokens off;
